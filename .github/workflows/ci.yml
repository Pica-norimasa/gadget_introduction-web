name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Prisma Clientの生成とNext.jsの型検査に必要な形式だけを満たす。
      # CI中に実DBへ接続しないため、実際の認証情報は渡さない。
      DATABASE_URL: mysql://user:password@localhost:3306/draftly_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
