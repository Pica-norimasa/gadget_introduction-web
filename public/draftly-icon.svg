<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Draftly icon</title>
  <desc id="desc">Draftly brand mark on a teal circular background.</desc>
  <defs>
    <linearGradient id="draftly-bg" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55d7c2"/>
      <stop offset="0.55" stop-color="#38bfa9"/>
      <stop offset="1" stop-color="#2e8ea7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#14110d"/>
  <circle cx="256" cy="256" r="184" fill="url(#draftly-bg)" filter="url(#soft-shadow)"/>
  <g fill="none" stroke="#15120e" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 356 184 272 160 176"/>
    <path d="M256 356 328 272 352 176"/>
  </g>
  <g fill="#15120e">
    <circle cx="256" cy="356" r="26"/>
    <circle cx="184" cy="272" r="30"/>
    <circle cx="328" cy="272" r="30"/>
    <circle cx="160" cy="176" r="38"/>
    <circle cx="352" cy="176" r="38"/>
  </g>
</svg>
